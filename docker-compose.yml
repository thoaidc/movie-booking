services:
  axon-server:
    image: axoniq/axonserver:latest-jdk-17-dev
    container_name: axon-server-prod
    networks:
      - network
    environment:
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: true
    ports:
      - "8024:8024"   # UI
      - "8124:8124"   # gRPC
    restart: unless-stopped

  # MySQL databases
  ticket-booking-db:
    image: mysql:8.0.40-oracle
    container_name: ticket-booking-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3300:3306"
    volumes:
      - mb_ticket_booking_data:/var/lib/mysql
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # DB initializer
  db-initializer:
    image: mysql:8.0.40-oracle
    container_name: db-initializer
    volumes:
      - ./scripts:/scripts
    command: "bash /scripts/init.sh"
    environment:
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      ticket-booking-db:
        condition: service_healthy
    networks:
      - network
    restart: no

  config-server:
    container_name: config-server
    build: ./config-server
    ports:
      - "8888:8888"
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Service Discovery
  service-registry:
    container_name: service-registry
    build: ./discovery-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # API Gateway
  gateway:
    container_name: gateway
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Microservices
  movie-service:
    container_name: movie-service
    build: ./services/movie-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ticket-booking-db:3306/mb_movie?useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      ticket-booking-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-service:
    container_name: user-service
    build: ./services/user-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ticket-booking-db:3306/mb_user?useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      ticket-booking-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  payment-service:
    container_name: payment-service
    build: ./services/payment-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ticket-booking-db:3306/mb_payment?useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      ticket-booking-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      gateway:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  booking-service:
    container_name: booking-service
    build: ./services/booking-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ticket-booking-db:3306/mb_booking?useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      ticket-booking-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      gateway:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  notification-service:
    container_name: notification-service
    build: ./services/notification-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ticket-booking-db:3306/mb_notification?useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      ticket-booking-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      gateway:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Angular frontend
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      service-registry:
        condition: service_healthy
      gateway:
        condition: service_healthy
      movie-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped

# Networks
networks:
  network:
    driver: bridge

# Volumes
volumes:
  mb_ticket_booking_data:
